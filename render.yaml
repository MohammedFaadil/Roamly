# Render Blueprint — one-click deploy for Roamly (web service; database is
# external, on Supabase — see README.md > "Deploying to Render" > "Database:
# Supabase" for the full walkthrough).
#
# Usage:
#   1. Push this repo to GitHub/GitLab.
#   2. In the Render dashboard: New > Blueprint > select this repo.
#   3. Render provisions the web service and generates JWT_SECRET for you.
#      DATABASE_URL and DIRECT_URL are NOT managed here (sync: false below) —
#      set them manually in the Render dashboard once, from your Supabase
#      project's Connect > ORMs > Prisma panel. Blueprint syncs will never
#      overwrite them.

services:
  - type: web
    name: roamly
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Runs once per deploy, after the build but before traffic switches to the
    # new instance: applies pending migrations, then seeds demo data only if
    # the database is empty (safe to run on every deploy — see
    # prisma/seed-if-empty.ts). If your plan doesn't support preDeployCommand,
    # run these two commands manually from the Render Shell after first deploy.
    preDeployCommand: npm run db:migrate:deploy && npm run db:seed:if-empty
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Supabase Postgres. Set both manually in the Render dashboard from
      # Supabase's Connect > ORMs > Prisma panel — DATABASE_URL is the
      # transaction pooler (port 6543, used at runtime), DIRECT_URL is the
      # session pooler (port 5432, used for `prisma migrate deploy`).
      # sync: false means Render never overwrites these from this file.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Uploaded vehicle photos / KYC files are written here (see
      # src/lib/storage.ts). On the free plan this is ephemeral — it resets on
      # every deploy/restart, which is fine for a demo. To persist uploads
      # across deploys, upgrade the service to a plan that supports disks,
      # uncomment the `disk:` block below, and point UPLOAD_DIR at its
      # mountPath.
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
    # disk:
    #   name: roamly-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    # (then set UPLOAD_DIR to /var/data/uploads instead, above)
